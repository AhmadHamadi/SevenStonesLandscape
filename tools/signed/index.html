<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<title>Signed Contracts | Seven Stones Landscape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
  :root{
    --brand:#1B62B5; --brand-deep:#134A8A;
    --band:#BDD4EA; --band-soft:#E4EEF7;
    --ink:#15202E; --muted:#6B7688;
    --rule:#C9D3DE; --rule-soft:#E3E9EF;
    --ground:#EDEFF2;
    --ok:#12674A; --ok-bg:#E4F1EB;
    --bad:#A32A20; --bad-bg:#FAE8E6;
    --warn:#8A5A00; --warn-bg:#FFF6E5;
    --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .shell{max-width:1080px;margin:0 auto;padding:22px 18px 90px;}

  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;
    border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:20px;
    box-shadow:0 2px 12px rgba(0,0,0,.06);}
  .bar .grow{flex:1 1 auto;}
  .bar h1{font-size:15px;margin:0;font-weight:700;}
  .bar p{margin:2px 0 0;font-size:12.5px;color:var(--muted);}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--rule);background:#fff;
    color:var(--ink);padding:9px 14px;font-weight:500;transition:.15s;}
  button:hover{border-color:var(--brand);color:var(--brand);}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;}
  button.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  .gate{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:26px;
    max-width:420px;margin:60px auto;}
  .gate h2{margin:0 0 6px;font-size:18px;}
  .gate p{margin:0 0 16px;font-size:14px;color:var(--muted);line-height:1.55;}
  .gate label{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
  .gate input{width:100%;border:1px solid var(--rule);border-radius:8px;background:#fff;
    font:inherit;font-size:16px;padding:11px 12px;margin-bottom:12px;}
  .gate input:focus{border-color:var(--brand);}
  .gate button{width:100%;}
  .gate .err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 11px;
    font-size:13.5px;margin-bottom:12px;}

  .msg{border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.6;margin-bottom:18px;}
  .msg.warn{background:var(--warn-bg);border:1px solid #E8CE93;color:var(--warn);}
  .msg.bad{background:var(--bad-bg);color:var(--bad);}
  .msg code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:rgba(0,0,0,.06);
    padding:1px 5px;border-radius:4px;}

  .search{margin-bottom:16px;}
  .search input{width:100%;border:1px solid var(--rule);border-radius:9px;background:#fff;
    font:inherit;font-size:15px;padding:11px 13px;}
  .search input:focus{border-color:var(--brand);}

  .rows{display:flex;flex-direction:column;gap:12px;}
  .row{background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden;}
  .row-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;}
  .row-head:hover{background:#F7F9FB;}
  .row-main{flex:1 1 220px;min-width:0;}
  .row-main b{display:block;font-size:15.5px;}
  .row-main span{font-size:13px;color:var(--muted);}
  .row-meta{flex:0 0 auto;text-align:right;font-size:13px;}
  .row-meta .price{font-weight:700;font-variant-numeric:tabular-nums;}
  .row-meta .when{color:var(--muted);font-size:12.5px;}
  .row-sig{flex:0 0 auto;width:110px;height:44px;display:flex;align-items:center;
    justify-content:center;border:1px solid var(--rule-soft);border-radius:6px;background:#FCFDFE;}
  .row-sig img{max-width:100%;max-height:100%;object-fit:contain;}
  .ref{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--muted);
    letter-spacing:.02em;}

  .row-body{border-top:1px solid var(--rule-soft);padding:0;display:none;}
  .row.open .row-body{display:block;}
  .row-actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#F7F9FB;
    border-bottom:1px solid var(--rule-soft);}
  .row-actions button{font-size:13px;padding:7px 12px;}
  .doc-host{background:#fff;max-height:70vh;overflow:auto;}

  .empty{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:44px 24px;
    text-align:center;color:var(--muted);}
  .empty h2{margin:0 0 8px;font-size:18px;color:var(--ink);}

  @media (max-width:620px){
    .row-head{gap:10px;}
    .row-sig{width:78px;height:36px;}
    .row-meta{text-align:left;flex:1 1 100%;}
  }
  @media print{
    body{background:#fff;}
    .bar,.search,.row-actions,.row-head,.noprint{display:none !important;}
    .shell{max-width:none;padding:0;}
    .row,.row-body{border:0;}
    .doc-host{max-height:none;overflow:visible;}
    .sheet{padding:0 !important;}
  }
</style>
</head>
<body>

<div class="shell">
  <div class="bar noprint">
    <div class="grow">
      <h1>Signed Contracts</h1>
      <p>Every agreement a customer has signed, newest first.</p>
    </div>
    <button type="button" id="refresh">Refresh</button>
    <button type="button" class="primary" id="newContract">New contract</button>
  </div>

  <div id="app">
    <div class="empty"><h2>Loading&hellip;</h2></div>
  </div>
</div>

<script type="module" src="/tools/signed/signed.js"></script>
<noscript>
  <div style="max-width:640px;margin:60px auto;padding:24px;text-align:center;font-family:sans-serif;">
    <h1>Signed Contracts</h1>
    <p>This internal tool needs JavaScript enabled.</p>
  </div>
</noscript>

</body>
</html>
